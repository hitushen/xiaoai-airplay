[package]
name = "xiaoai-airplay"
version = "0.3.0"
edition = "2021"
license = "LGPL-3.0-or-later"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shairplay = { path = "vendor/shairplay", default-features = false, features = ["ap2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
