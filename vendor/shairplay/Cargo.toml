[package]
edition = "2024"
rust-version = "1.94"
name = "shairplay"
version = "0.10.0"
build = false
include = [
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/AP2-STATUS.md",
    "/docs/**",
    "/airport.key",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Pure Rust AirPlay server library"
homepage = "https://github.com/metaneutrons/shairplay-rust"
readme = "README.md"
keywords = [
    "airplay",
    "raop",
    "audio",
    "streaming",
    "apple",
]
categories = [
    "multimedia::audio",
    "network-programming",
]
license = "LGPL-3.0-or-later"
repository = "https://github.com/metaneutrons/shairplay-rust"

[features]
ap2 = [
    "resample",
    "dep:chacha20poly1305",
    "dep:hkdf",
    "dep:num-bigint",
    "dep:uuid",
    "dep:symphonia",
]
dangerous-raw-headers = ["diagnostic-headers"]
default = []
diagnostic-headers = []
hls = ["video"]
pipewire-auth-setup-compat = []
resample = ["dep:rubato"]
video = ["ap2"]

[lib]
name = "shairplay"
path = "src/lib.rs"

[[example]]
name = "player"
path = "examples/player/main.rs"
required-features = []

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "unit_tests"
path = "tests/unit_tests.rs"

